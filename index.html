<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoonFlix KDrama</title>

<meta name="description" content="MoonFlix KDrama - Korean, Chinese, Japanese, Thai dramas and Hindi dubbed anime.">

<link rel="icon" type="image/png" href="moonflix-logo.png">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0712;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #140b20;
    padding: 20px;
    text-align: center;
}

.logo {
    width: 180px;
    max-width: 80%;
}

.tagline {
    color: #aaa;
    margin-top: 8px;
}

.search {
    padding: 20px 15px;
    text-align: center;
}

.search input {
    width: 90%;
    max-width: 500px;
    padding: 13px;
    border: none;
    border-radius: 25px;
    background: #171020;
    color: white;
    font-size: 15px;
}

.nav {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 15px 15px;
}

.nav button {
    background: #251433;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 20px;
    white-space: nowrap;
}

h2 {
    padding: 0 15px;
    color: #d9a7ff;
}

/* OLDER DRAMAS SLIDER */

.slider-section {
    padding: 10px 15px 20px;
}

.slider {
    position: relative;
    max-width: 420px;
    margin: auto;
    background: #171020;
    border-radius: 15px;
    padding: 12px;
    text-align: center;
}

.slider img {
    width: 100%;
    height: 430px;
    object-fit: cover;
    border-radius: 12px;
}

.slider h3 {
    margin: 12px 0 5px;
}

.slider p {
    color: #aaa;
    font-size: 13px;
}

.arrow {
    position: absolute;
    top: 45%;
    transform: translateY(-50%);
    width: 38px;
    height: 48px;
    border: none;
    border-radius: 10px;
    background: rgba(0,0,0,0.75);
    color: white;
    font-size: 28px;
}

.arrow.left {
    left: 20px;
}

.arrow.right {
    right: 20px;
}

.dots {
    color: #d9a7ff;
}

/* DRAMA BOXES */

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

.card {
    background: #171020;
    padding: 10px;
    border-radius: 12px;
    text-align: center;
}

.card a {
    text-decoration: none;
    color: white;
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 10px;
}

.card h3 {
    font-size: 15px;
}

.card small {
    color: #aaa;
}

.contact {
    text-align: center;
    padding: 25px;
}

.contact a {
    text-decoration: none;
    color: white;
    margin: 8px;
    font-size: 17px;
}

.social-icon {
    font-size: 24px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <img class="logo" src="moonflix-logo.png" alt="MoonFlix KDrama">
    <div class="tagline">Your World of Dramas</div>
</header>

<div class="search">
    <input
        type="text"
        id="searchInput"
        placeholder="Search dramas..."
        oninput="searchDrama()">
</div>

<div class="nav">
    <button onclick="showCategory('all')">Home</button>
    <button onclick="showCategory('kdrama')">K-Drama</button>
    <button onclick="showCategory('cdrama')">C-Drama</button>
    <button onclick="showCategory('jdrama')">J-Drama</button>
    <button onclick="showCategory('thai')">Thai Drama</button>
    <button onclick="showCategory('anime')">Anime</button>
    <button onclick="showCategory('hindi')">Hindi Dubbed</button>
</div>

<!-- OLDER DRAMAS: ONLY 4 -->

<section class="slider-section" id="olderSection">

<h2>Older MX Player Dramas</h2>

<div class="slider">

<button class="arrow left" onclick="previousOlder()">‹</button>

<a id="olderLink" href="#">
<img id="olderImage" src="" alt="Drama">
<h3 id="olderTitle">Drama</h3>
</a>

<p id="olderInfo"></p>

<button class="arrow right" onclick="nextOlder()">›</button>

<div class="dots" id="olderDots"></div>

</div>

</section>

<!-- NEW DRAMAS: ONLY 4 -->

<h2>New Dramas</h2>

<div class="grid" id="newGrid"></div>

<!-- CATEGORIES -->

<h2 id="categoryTitle">All Dramas</h2>

<div class="grid" id="categoryGrid"></div>

<div class="contact">

<h2>Contact Me 🌙</h2>

<a href="https://www.instagram.com/its_me_mehrjan/" target="_blank">
📸 Instagram
</a>

<br><br>

<a href="https://t.me/Mehrukdrama" target="_blank">
📱 Telegram
</a>

</div>

<footer>
© 2026 MoonFlix KDrama
</footer>

<script>

/* TOP 4 OLDER DRAMAS */

const olderDramas = [

/*
{
title: "Drama Name",
image: "drama.jpeg",
page: "drama.html",
category: "cdrama",
country: "China"
}
*/

];


/* LATEST 4 NEW DRAMAS */

const newDramas = [
{
    title: "Flower of Evil",
    image: "flower-of-evil.jpeg",
    page: "flower-of-evil.html",
    category: "kdrama",
    country: "Korea"
},

{
    title: "As Beautiful As You",
    image: "as-beautiful-as-you.jpeg",
    page: "as-beautiful-as-you.html",
    category: "cdrama",
    country: "China"
},

{
    title: "Perfect Crown",
    image: "Perfect-Crown.jpeg",
    page: "Perfect-crown.html",
    category: "kdrama",
    country: "Korea"
},

{
    title: "The East Palace",
    image: "the-east-palace.jpeg",
    page: "the-east-palace.html",
    category: "cdrama",
    country: "China"
}
    {
    title: "The East Palace",
    image: "the-east-palace.jpeg",
    page: "the-east-palace.html",
    category: "cdrama",
    country: "China"
}

];


/* ALL DRAMAS */

const allDramas = [

{
title: "Falling For Love",
image: "poster.jpeg",
page: "filing-for-love.html",
category: "cdrama",
country: "China"
},

{
title: "The East Palace",
image: "the-east-palace.jpeg",
page: "the-east-palace.html",
category: "cdrama",
country: "China"
},

{
title: "A Love Other Than Yours",
image: "a-love-other-than-yours.jpeg",
page: "A-love-other-than-yours.html",
category: "cdrama",
country: "China"
},

{
title: "Perfect Crown",
image: "Perfect-Crown.jpeg",
page: "Perfect-crown.html",
category: "kdrama",
country: "Korea"
},

{
title: "Dear X",
image: "Dear-X.jpeg",
page: "Dear-X.html",
category: "kdrama",
country: "Korea"
},

{
title: "The Ordinary Jackpot",
image: "the-ordinary-jackpot.jpeg",
page: "The-ordinary-jackpot.html",
category: "kdrama",
country: "Korea"
}

];

let selectedCategory = "all";
let olderIndex = 0;

function getLatestFour(list) {
    return list.slice(0, 4);
}


/* OLDER SLIDER */

function renderOlderSlider() {

    const list = getLatestFour(olderDramas);

    if (list.length === 0) {
        document.getElementById("olderSection").style.display = "none";
        return;
    }

    document.getElementById("olderSection").style.display = "block";

    if (olderIndex >= list.length) olderIndex = 0;

    const drama = list[olderIndex];

    document.getElementById("olderImage").src = drama.image;
    document.getElementById("olderImage").alt = drama.title;
    document.getElementById("olderTitle").textContent = drama.title;
    document.getElementById("olderInfo").textContent =
        drama.country + " • " + drama.category;

    document.getElementById("olderLink").href = drama.page;

    document.getElementById("olderDots").textContent =
        (olderIndex + 1) + " / " + list.length;
}

function previousOlder() {

    const list = getLatestFour(olderDramas);

    if (list.length === 0) return;

    olderIndex--;

    if (olderIndex < 0) {
        olderIndex = list.length - 1;
    }

    renderOlderSlider();
}

function nextOlder() {

    const list = getLatestFour(olderDramas);

    if (list.length === 0) return;

    olderIndex++;

    if (olderIndex >= list.length) {
        olderIndex = 0;
    }

    renderOlderSlider();
}


/* CREATE DRAMA CARD */

function createCard(drama) {

    const card = document.createElement("div");

    card.className = "card";

    card.dataset.category = drama.category;
    card.dataset.name = drama.title.toLowerCase();

    card.innerHTML = `
        <a href="${drama.page}">
            <img src="${drama.image}" alt="${drama.title}">
            <h3>${drama.title}</h3>
            <small>${drama.country}</small>
        </a>
    `;

    return card;
}


/* NEW DRAMAS */

function renderNewDramas() {

    const grid = document.getElementById("newGrid");

    grid.innerHTML = "";

    getLatestFour(newDramas).forEach(function(drama) {

        grid.appendChild(createCard(drama));

    });
}


/* CATEGORY DRAMAS */

function renderCategories() {

    const grid = document.getElementById("categoryGrid");

    grid.innerHTML = "";

    let list = allDramas;

    if (selectedCategory !== "all") {

        list = list.filter(function(drama) {

            return drama.category === selectedCategory;

        });

    }

    list.forEach(function(drama) {

        grid.appendChild(createCard(drama));

    });

    document.getElementById("categoryTitle").textContent =
        selectedCategory === "all"
        ? "All Dramas"
        : selectedCategory.toUpperCase() + " Dramas";
}


/* CATEGORY BUTTON */

function showCategory(category) {

    selectedCategory = category;

    renderCategories();

    searchDrama();

}


/* SEARCH */

function searchDrama() {

    const text =
        document.getElementById("searchInput").value.toLowerCase();

    const cards =
        document.querySelectorAll("#categoryGrid .card");

    cards.forEach(function(card) {

        const name = card.dataset.name;

        card.style.display =
            name.includes(text) ? "block" : "none";

    });

}


/* START */

renderOlderSlider();

renderNewDramas();

renderCategories();

</script>

</body>
</html>
