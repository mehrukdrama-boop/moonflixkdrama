<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoonFlix KDrama</title>

<link rel="icon" type="image/png" href="moonflix-logo.png">

<style>
body {
    margin: 0;
    background: #0b0712;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #140b20;
    padding: 20px;
    text-align: center;
}

.logo {
    width: 180px;
    max-width: 80%;
}

.tagline {
    color: #aaa;
    margin-top: 8px;
}

.search {
    padding: 20px 15px;
    text-align: center;
}

.search input {
    width: 90%;
    max-width: 500px;
    padding: 13px;
    border: none;
    border-radius: 25px;
    background: #171020;
    color: white;
    font-size: 15px;
}

.nav {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 15px 15px;
}

.nav button {
    background: #251433;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 20px;
    white-space: nowrap;
    cursor: pointer;
}

.nav button:hover {
    background: #6b3294;
}

h2 {
    padding: 0 15px;
    color: #d9a7ff;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

.card {
    background: #171020;
    padding: 10px;
    border-radius: 12px;
    text-align: center;
}

.card a {
    text-decoration: none;
    color: white;
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 10px;
}

.card h3 {
    font-size: 15px;
}

.contact {
    text-align: center;
    padding: 25px;
}

.contact h2 {
    padding: 0;
}

.contact a {
    text-decoration: none;
    color: white;
    margin: 8px;
    font-size: 17px;
}

.social-icon {
    font-size: 24px;
    vertical-align: middle;
    margin-right: 5px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}
</style>
</head>

<body>

<header>

    <img class="logo"
         src="moonflix-logo.png"
         alt="MoonFlix KDrama">

    <div class="tagline">Your World of Dramas</div>

</header>

<div class="search">

    <input
        type="text"
        id="searchInput"
        placeholder="Search dramas..."
        oninput="searchDrama()">

</div>

<div class="nav">

    <button onclick="showCategory('all')">Home</button>
    <button onclick="showCategory('kdrama')">K-Drama</button>
    <button onclick="showCategory('cdrama')">C-Drama</button>
    <button onclick="showCategory('jdrama')">J-Drama</button>
    <button onclick="showCategory('thai')">Thai Drama</button>
    <button onclick="showCategory('hindi')">Hindi Dubbed</button>

</div>

<h2>Popular Dramas</h2>

<div class="grid" id="dramaGrid">

    <!-- Falling For Love -->

    <div class="card"
         data-category="cdrama"
         data-name="falling for love">

        <a href="filing-for-love.html">

            <img src="poster.jpeg"
                 alt="Falling For Love">

            <h3>Falling For Love</h3>

        </a>

    </div>


    <!-- The East Palace -->

    <div class="card"
         data-category="cdrama"
         data-name="the east palace">

        <a href="the-east-palace.html">

            <img src="the-east-palace.jpeg"
                 alt="The East Palace">

            <h3>The East Palace</h3>

        </a>

    </div>


    <!-- A Love Other Than Yours -->

    <div class="card"
         data-category="cdrama"
         data-name="a love other than yours">

        <a href="A-love-other-than-yours.html">

            <img src="a-love-other-than-yours.jpeg"
                 alt="A Love Other Than Yours">

            <h3>A Love Other Than Yours</h3>

        </a>

    </div>


    <!-- Perfect Crown -->

    <div class="card"
         data-category="kdrama"
         data-name="perfect crown">

        <a href="Perfect-crown.html">

            <img src="Perfect-Crown.jpeg"
                 alt="Perfect Crown">

            <h3>Perfect Crown</h3>

        </a>

    </div>


    <!-- Dear X -->

    <div class="card"
         data-category="kdrama"
         data-name="dear x">

        <a href="Dear-X.html">

            <img src="Dear-X.jpeg"
                 alt="Dear X">

            <h3>Dear X</h3>

        </a>

    </div>


    <!-- The Ordinary Jackpot -->

    <div class="card"
         data-category="kdrama"
         data-name="the ordinary jackpot">

        <a href="The-ordinary-jackpot.html">

            <img src="the-ordinary-jackpot.jpeg"
                 alt="The Ordinary Jackpot">

            <h3>The Ordinary Jackpot</h3>

        </a>

    </div>

</div>


<!-- Contact Section -->

<div class="contact">

    <h2>Contact Me 🌙</h2>

    <a href="https://www.instagram.com/its_me_mehrjan/"
       target="_blank">

        <span class="social-icon">📸</span>
        Instagram

    </a>

    <br><br>

    <a href="https://t.me/Mehrukdrama"
       target="_blank">

        <span class="social-icon">📱</span>
        Telegram

    </a>

</div>


<footer>

    © 2026 MoonFlix KDrama

</footer>


<script>

let selectedCategory = "all";

function showCategory(category) {

    selectedCategory = category;

    filterDramas();

}

function searchDrama() {

    filterDramas();

}

function filterDramas() {

    let searchText =
        document.getElementById("searchInput").value.toLowerCase();

    let cards =
        document.querySelectorAll(".card");

    cards.forEach(function(card) {

        let name =
            card.getAttribute("data-name").toLowerCase();

        let category =
            card.getAttribute("data-category").toLowerCase();

        let matchesSearch =
            name.includes(searchText);

        let matchesCategory =
            selectedCategory === "all" ||
            category === selectedCategory;

        if (matchesSearch && matchesCategory) {

            card.style.display = "block";

        } else {

            card.style.display = "none";

        }

    });

}

</script>

</body>
</html>
